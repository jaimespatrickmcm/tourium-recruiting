<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<title>Seu código de acesso</title>
<style>
  @media only screen and (max-width:600px) {
    .wrap { padding:20px 12px !important; }
    .card { border-radius:18px !important; }
    .pad { padding:32px 22px 34px !important; }
    .h1 { font-size:26px !important; }
    .code { font-size:28px !important; letter-spacing:5px !important; padding:16px 20px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#f5f5f7;-webkit-font-smoothing:antialiased;">
<span style="display:none!important;max-height:0;overflow:hidden;opacity:0;">Seu código de acesso no Noren</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f5f7;">
  <tr>
    <td class="wrap" align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="card" style="max-width:520px;background:#ffffff;border-radius:22px;overflow:hidden;">
        <tr>
          <td class="pad" align="center" style="padding:44px 40px 46px;">

            <p style="margin:0 0 30px;font-size:15px;font-weight:600;letter-spacing:-0.1px;color:#0f0f14;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">Noren</p>

            <h1 class="h1" style="margin:0 0 12px;font-size:30px;line-height:1.18;font-weight:700;letter-spacing:-0.8px;color:#0f0f14;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">Seu código de acesso</h1>

            <p style="margin:0 0 26px;font-size:17px;line-height:1.6;color:#4a4a52;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">Digite este código na tela de login:</p>

            <p class="code" style="margin:0;display:inline-block;padding:18px 28px;background:#f5f5f7;border-radius:16px;font-size:32px;font-weight:700;letter-spacing:8px;color:#0f0f14;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</p>

            <p style="margin:26px 0 0;font-size:14px;line-height:1.55;color:#8a8a93;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">O código vale por 1 hora. Se não foi você que pediu, pode ignorar este email.</p>

          </td>
        </tr>
      </table>
      <p style="margin:18px 0 0;font-size:12px;color:#a1a1aa;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">Enviado pela Noren</p>
    </td>
  </tr>
</table>
</body>
</html>
