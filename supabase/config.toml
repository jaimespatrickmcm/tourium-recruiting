project_id = "noren"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:8881"
additional_redirect_urls = ["http://localhost:8881"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Templates dos emails de auth (código OTP), no visual Noren. Aplicar em
# produção com: supabase config push --project-ref dknakecjaakbssuqxsjf
[auth.email.template.magic_link]
subject = "Seu código de acesso no Noren"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Seu código pra entrar no Noren"
content_path = "./supabase/templates/confirmation.html"

[auth.external.linkedin_oidc]
enabled = false
client_id = "env(SUPABASE_AUTH_LINKEDIN_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_LINKEDIN_SECRET)"

# Custom Access Token Hook — injeta company_id + user_role nos JWT claims.
# Configurado localmente aqui; em produção, configurar via Dashboard:
# Authentication → Hooks → Custom Access Token Hook → public.custom_access_token_hook
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Edge functions per-function config
# scrape-company precisa ser callable autenticado (qualquer user logado da empresa)
[functions.scrape-company]
verify_jwt = true

# submit-application: público (candidato sem login)
[functions.submit-application]
verify_jwt = false

# analyze-candidate: verify_jwt off porque aceita DOIS callers distintos e faz o
# gate internamente: bearer == service_role (submit-application) ou JWT de user
# da empresa dona da application (botão re-analisar na UI).
[functions.analyze-candidate]
verify_jwt = false

# generate-job-description valida o JWT internamente via getUser()
[functions.generate-job-description]
verify_jwt = true

# generate-job-requirements: gabarito interno da vaga. Valida JWT + ownership.
[functions.generate-job-requirements]
verify_jwt = true

# generate-development-plan: owner-only. Valida JWT + role internamente e
# escreve com o cliente do chamador (RLS aplica).
[functions.generate-development-plan]
verify_jwt = true

# application-prefill: público. Valida token do candidato (applicant_tokens) pra
# devolver os dados que já temos e pré-preencher o form individual.
[functions.application-prefill]
verify_jwt = false

# transcribe-audio: público, chamado do formulário do candidato. Endpoint PAGO,
# então o gate interno é o mesmo do submit: precisa da candidatura E do token do
# link individual do e-mail. O áudio nunca é armazenado.
[functions.transcribe-audio]
verify_jwt = false

# map-candidate-skills: recrutador logado. Valida JWT + ownership internamente e
# usa service_role pras leituras e escritas.
[functions.map-candidate-skills]
verify_jwt = true

# notify-stage-change: recrutador logado. Manda e-mail da virada de etapa e
# devolve link do form + link de WhatsApp. Valida JWT + ownership internamente.
[functions.notify-stage-change]
verify_jwt = true

# delete-application: recrutador logado apaga candidatura da própria empresa.
# Valida JWT + ownership internamente e usa service_role pros deletes.
[functions.delete-application]
verify_jwt = true

# delete-collaborator: recrutador logado remove alguém do time da própria empresa.
# Valida JWT + ownership internamente e usa service_role pros deletes.
[functions.delete-collaborator]
verify_jwt = true

# debug-login: dev-only, guardado pelo secret DEBUG_LOGIN_ENABLED
[functions.debug-login]
verify_jwt = false
